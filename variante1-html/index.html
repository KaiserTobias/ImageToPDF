<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageToPDF</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#656d76; --card:#fff; --accent:#2563eb; --border:#d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#e6e8ea; --muted:#9aa4ad; --card:#1e2226; --border:#3a4046; } }
  * { box-sizing:border-box; }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:16px; }
  main { max-width:820px; margin:0 auto; }
  h1 { margin:8px 0 16px; }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:28px 16px; text-align:center; cursor:pointer; background:var(--card); }
  #drop.over { border-color:var(--accent); }
  small, .muted { color:var(--muted); }
  ul { list-style:none; padding:0; margin:16px 0; }
  li { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px; margin-bottom:6px; }
  li.drag { opacity:.4; }
  li .thumb { width:64px; height:64px; display:flex; align-items:center; justify-content:center; flex:none; }
  li img { max-width:64px; max-height:64px; border-radius:4px; transition:transform .15s; }
  li .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button, select, input[type=text], input[type=number] { font:inherit; padding:7px 11px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  fieldset { border:1px solid var(--border); border-radius:10px; background:var(--card); margin:0 0 12px; padding:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  legend { padding:0 6px; color:var(--muted); }
  label { display:flex; flex-direction:column; gap:4px; font-size:.9rem; }
  label.row { flex-direction:row; align-items:center; gap:8px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  #status { min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>ImageToPDF</h1>
  <div id="drop" tabindex="0">Bilder hierher ziehen, klicken zum Auswählen oder mit Strg+V einfügen<br><small>JPG, PNG, GIF, WebP, BMP … · Alles bleibt lokal in deinem Browser.</small></div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <ul id="list"></ul>
  <div class="bar" style="margin-bottom:12px">
    <span id="count" class="muted">Keine Bilder</span>
    <span><button id="sort">A–Z sortieren</button> <button id="clear">Alle entfernen</button></span>
  </div>

  <fieldset>
    <legend>Einstellungen</legend>
    <label>Seitengröße
      <select id="size">
        <option value="a4">A4</option>
        <option value="letter">US Letter</option>
        <option value="fit">An Bild anpassen</option>
      </select>
    </label>
    <label>Ausrichtung
      <select id="orient">
        <option value="auto">Automatisch (je Bild)</option>
        <option value="p">Hochformat</option>
        <option value="l">Querformat</option>
      </select>
    </label>
    <label>Seitenrand
      <select id="margin">
        <option value="0">Kein Rand</option>
        <option value="10">10 mm</option>
        <option value="15" selected>15 mm</option>
        <option value="25">25 mm</option>
      </select>
    </label>
    <label><span>JPEG-Qualität: <span id="qv">95</span> %</span>
      <input id="quality" type="range" min="50" max="100" value="95">
    </label>
    <label>Dateiname
      <input id="fname" type="text" value="bilder.pdf">
    </label>
    <label class="row"><input id="fill" type="checkbox"> Bild füllt die Seite (zuschneiden)</label>
  </fieldset>

  <div class="bar">
    <span id="status" class="muted"></span>
    <button id="go" class="primary" disabled>PDF erstellen</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const items = []; // {name, blob, url, rot (0/90/180/270)}
const PAGES = { a4: [595.28, 841.89], letter: [612, 792] };

// ---------- Hinzufügen ----------
const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') file.click(); };
file.onchange = () => { add(file.files); file.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
document.addEventListener('paste', e => add([...e.clipboardData.files]));
// Dateien, die versehentlich neben die Dropzone fallen, nicht im Browser öffnen
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.target !== drop && e.dataTransfer?.files.length) add(e.dataTransfer.files); });

function add(files) {
  let skipped = 0;
  for (const f of files) {
    if (f.type.startsWith('image/')) items.push({ name: f.name || 'Einfügung.png', blob: f, url: URL.createObjectURL(f), rot: 0 });
    else skipped++;
  }
  render();
  if (skipped) status(`${skipped} Datei(en) übersprungen (kein Bild).`);
}

// ---------- Liste ----------
let dragIdx = null;
function render() {
  const list = $('list'); list.innerHTML = '';
  items.forEach((it, i) => {
    const li = document.createElement('li');
    li.draggable = true;
    li.ondragstart = () => { dragIdx = i; li.classList.add('drag'); };
    li.ondragend = () => li.classList.remove('drag');
    li.ondragover = e => e.preventDefault();
    li.ondrop = e => { e.preventDefault(); e.stopPropagation(); if (dragIdx === null) return; items.splice(i, 0, items.splice(dragIdx, 1)[0]); dragIdx = null; render(); };
    li.innerHTML = `<div class="thumb"><img alt="" style="transform:rotate(${it.rot}deg)"></div><span class="name"></span>`;
    li.querySelector('img').src = it.url;
    li.querySelector('.name').textContent = `${i + 1}. ${it.name}`;
    for (const [label, title, fn] of [
      ['↶', 'Links drehen', () => { it.rot = (it.rot + 270) % 360; render(); }],
      ['↷', 'Rechts drehen', () => { it.rot = (it.rot + 90) % 360; render(); }],
      ['↑', 'Nach oben', () => move(i, -1)],
      ['↓', 'Nach unten', () => move(i, 1)],
      ['✕', 'Entfernen', () => { URL.revokeObjectURL(it.url); items.splice(i, 1); render(); }],
    ]) { const b = document.createElement('button'); b.textContent = label; b.title = title; b.onclick = fn; li.append(b); }
    list.append(li);
  });
  $('count').textContent = items.length ? `${items.length} Bild${items.length > 1 ? 'er' : ''}` : 'Keine Bilder';
  $('go').disabled = !items.length;
}
function move(i, d) { const j = i + d; if (j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; render(); }
$('sort').onclick = () => { items.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true })); render(); };
$('clear').onclick = () => { items.forEach(i => URL.revokeObjectURL(i.url)); items.length = 0; render(); status(''); };
$('quality').oninput = e => $('qv').textContent = e.target.value;
function status(t) { $('status').textContent = t; }

// ---------- Bild → JPEG (EXIF-Drehung, eigene Drehung, Transparenz auf Weiß) ----------
async function toJpeg(it, q) {
  const bmp = await createImageBitmap(it.blob, { imageOrientation: 'from-image' });
  const swap = it.rot % 180 !== 0;
  const c = document.createElement('canvas');
  c.width = swap ? bmp.height : bmp.width; c.height = swap ? bmp.width : bmp.height;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.translate(c.width / 2, c.height / 2); g.rotate(it.rot * Math.PI / 180);
  g.drawImage(bmp, -bmp.width / 2, -bmp.height / 2);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  if (!blob) throw new Error(`„${it.name}“ ist zu groß für den Browser.`);
  return { w: c.width, h: c.height, data: new Uint8Array(await blob.arrayBuffer()) };
}

// ---------- PDF schreiben ----------
function buildPdf(imgs, o) {
  const enc = new TextEncoder(), parts = [], offsets = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (head, stream) => {
    offsets.push(len); push(`${offsets.length} 0 obj\n${head}\n`);
    if (stream) { push('stream\n'); push(stream); push('\nendstream\n'); }
    push('endobj\n');
  };
  push('%PDF-1.4\n');
  obj('<< /Type /Catalog /Pages 2 0 R >>');
  obj(`<< /Type /Pages /Kids [${imgs.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] /Count ${imgs.length} >>`);
  const M = o.margin * 72 / 25.4;
  imgs.forEach((im, i) => {
    let pw, ph, dw, dh, x = 0, y = 0, clip = '';
    if (o.size === 'fit') {
      dw = im.w * 0.75; dh = im.h * 0.75; pw = dw; ph = dh;
    } else {
      [pw, ph] = PAGES[o.size];
      const landscape = o.orient === 'l' || (o.orient === 'auto' && im.w > im.h);
      if (landscape) [pw, ph] = [ph, pw];
      const aw = pw - 2 * M, ah = ph - 2 * M;
      const s = o.fill ? Math.max(aw / im.w, ah / im.h) : Math.min(aw / im.w, ah / im.h);
      dw = im.w * s; dh = im.h * s; x = (pw - dw) / 2; y = (ph - dh) / 2;
      if (o.fill) clip = `${M.toFixed(2)} ${M.toFixed(2)} ${aw.toFixed(2)} ${ah.toFixed(2)} re W n `;
    }
    const id = 3 + i * 3;
    obj(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Contents ${id + 1} 0 R /Resources << /XObject << /Im0 ${id + 2} 0 R >> >> >>`);
    const c = `q ${clip}${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
    obj(`<< /Length ${c.length} >>`, enc.encode(c));
    obj(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>`, im.data);
  });
  const xref = len;
  push(`xref\n0 ${offsets.length + 1}\n0000000000 65535 f \n`);
  offsets.forEach(o => push(String(o).padStart(10, '0') + ' 00000 n \n'));
  push(`trailer\n<< /Size ${offsets.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

$('go').onclick = async () => {
  const go = $('go'); go.disabled = true;
  try {
    const q = $('quality').value / 100, imgs = [];
    for (const [i, it] of items.entries()) { status(`Verarbeite Bild ${i + 1} von ${items.length} …`); imgs.push(await toJpeg(it, q)); }
    const pdf = buildPdf(imgs, { size: $('size').value, orient: $('orient').value, margin: +$('margin').value, fill: $('fill').checked });
    let name = $('fname').value.trim() || 'bilder.pdf'; if (!/\.pdf$/i.test(name)) name += '.pdf';
    const a = document.createElement('a'); a.href = URL.createObjectURL(pdf); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    status(`Fertig: ${name} (${(pdf.size / 1048576).toFixed(2)} MB)`);
  } catch (e) { status(''); alert('Fehler: ' + e.message); }
  go.disabled = !items.length;
};
render();
</script>
</body>
</html>
